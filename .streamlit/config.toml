# Project-level Streamlit configuration
# This file is automatically loaded when running `streamlit run` from this directory.
# No changes to the global ~/.streamlit/config.toml are needed.
#
# For normal local development, the defaults are sufficient — leave everything commented.
# Uncomment a section ONLY when you hit a specific scenario described in the README.

# [server]

# --- Scenario: Access from another device on the same LAN ---
# By default Streamlit only listens on localhost. Uncomment to bind to all interfaces.
# address = "0.0.0.0"

# --- Scenario: Port conflict ---
# Uncomment to use a different port (or pass --server.port on the command line).
# port = 8501

# --- Scenario: Headless / remote server ---
# Uncomment to suppress the auto-open-browser prompt (WSL, SSH, Docker, etc.).
# headless = true

# --- Scenario: Behind a reverse proxy or in a cloud environment ---
# Uncomment ONLY if you see CORS errors in the browser console.
# Local development on localhost should NEVER need this.
# enableCORS = false
